name: AMARBERRY Godot 4.7.2 Runtime Validation

on:
  push:
    branches: ["amarberry-v2-2-parse-ci"]
  pull_request:
    branches: ["main"]

jobs:
  godot-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact AMARBERRY code payload
        shell: bash
        run: |
          set -euo pipefail
          cat ci/payload_00.b64 ci/payload_01.b64 ci/payload_02.b64 ci/payload_03.b64 ci/payload_04.b64 > payload.b64
          base64 -d payload.b64 > payload.tar.gz
          mkdir -p project
          tar -xzf payload.tar.gz -C project
          cp ci/hud_3d.gd project/scripts/hud_3d.gd
          python3 ci/patch_main_audio.py project/scripts/main_3d.gd
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib, wave
          root = Path('project')
          (root/'textures').mkdir(parents=True, exist_ok=True)
          (root/'audio').mkdir(parents=True, exist_ok=True)
          def png(path, w=8, h=8, rgb=(80,90,100)):
              raw = b''.join(b'\x00' + bytes(rgb)*w for _ in range(h))
              def chunk(t,d):
                  return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              data = b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b'')
              Path(path).write_bytes(data)
          png(root/'textures/ground.png', 8, 8, (62,68,73))
          png(root/'textures/icon.png', 8, 8, (168,50,70))
          for name in ['rifle','shotgun','pulse','launcher','explosion','pickup','levelup','hurt','acid','ambient']:
              with wave.open(str(root/'audio'/f'{name}.wav'),'wb') as f:
                  f.setnchannels(1); f.setsampwidth(2); f.setframerate(22050); f.writeframes(b'\x00\x00'*2205)
          PY
          test -z "$(grep -R ':=' project --include='*.gd' || true)"

      - name: Diagnose audio implementation
        shell: bash
        run: |
          set -euo pipefail
          echo '===== AUDIO IMPLEMENTATION ====='
          grep -n -C 18 -E 'AudioStreamPlayer|SFX_LEVELUP|func .*sfx|func .*audio|\.play\(\)' project/scripts/main_3d.gd || true
          echo '===== END AUDIO IMPLEMENTATION ====='

      - name: Install official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import project resources and parse scripts
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --editor --path project --quit 2>&1 | tee import.log
          ! grep -E "ERROR:|SCRIPT ERROR|Parse Error|Cannot infer the type|leaked at exit|resources still in use" import.log

      - name: Godot smoke test
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --verbose --path project res://tests/runtime/smoke_3d.tscn --quit-after 600 2>&1 | tee smoke.log
          grep -F "AMARBERRY_3D_SMOKE: PASS" smoke.log
          ! grep -E "ERROR:|SCRIPT ERROR|Parse Error|Cannot infer the type|leaked at exit|resources still in use" smoke.log

      - name: Godot mission integration test
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --verbose --path project res://tests/runtime/integration_3d.tscn --quit-after 1200 2>&1 | tee integration.log
          grep -F "AMARBERRY_3D_INTEGRATION: PASS" integration.log
          ! grep -E "ERROR:|SCRIPT ERROR|Parse Error|Cannot infer the type|leaked at exit|resources still in use" integration.log
