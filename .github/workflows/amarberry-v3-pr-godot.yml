name: AMARBERRY v3 PR Godot 4.7.2 Verification

on:
  pull_request:
    branches: ["main"]

jobs:
  godot-v3-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and patch V3
        shell: bash
        run: |
          set -euo pipefail
          cat ci/v3_payload_00.b64 ci/v3_payload_01.b64 ci/v3_payload_02.b64 ci/v3_payload_03.b64 > /tmp/v3_payload.b64
          base64 -d /tmp/v3_payload.b64 > /tmp/v3_code_payload.tar.gz
          echo "e2be48669b848114d81fa3f7d46ee8a63d756094e629463c795833a2b35b08b0  /tmp/v3_code_payload.tar.gz" | sha256sum -c -
          mkdir -p project
          tar -xzf /tmp/v3_code_payload.tar.gz -C project
          python3 ci/v3_runtime_patch.py project
          test -z "$(grep -R ':=' project --include='*.gd' || true)"
          sha256sum project/scripts/*.gd project/tests/runtime/*.gd project/project.godot

      - name: Generate CI media
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct,zlib,wave
          r=Path('project'); (r/'textures/heroes').mkdir(parents=True,exist_ok=True); (r/'textures/aliens').mkdir(parents=True,exist_ok=True); (r/'audio').mkdir(parents=True,exist_ok=True)
          def png(p,c):
              w=h=64; rows=[]
              for y in range(h):
                  row=bytearray()
                  for x in range(w): row+=bytes((c[0],c[1],c[2],c[3] if 5<x<59 and 5<y<59 else 0))
                  rows.append(b'\x00'+bytes(row))
              raw=b''.join(rows)
              def ch(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              Path(p).write_bytes(b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+ch(b'IDAT',zlib.compress(raw))+ch(b'IEND',b''))
          png(r/'textures/ground.png',(50,58,68,255)); png(r/'textures/icon.png',(200,40,65,255))
          for n in ['commando','guardian','engineer','sniper','dashberry','rageberry']: png(r/'textures/heroes'/f'{n}.png',(180,100,220,255))
          for n in ['swarmer','hunter','spitter','stalker','artillery','breeder','warden','matriarch']: png(r/'textures/aliens'/f'{n}.png',(130,70,210,255))
          for n in ['rifle','shotgun','pulse','launcher','explosion','pickup','levelup','hurt','acid','ambient']:
              with wave.open(str(r/'audio'/f'{n}.wav'),'wb') as f: f.setnchannels(1); f.setsampwidth(2); f.setframerate(22050); f.writeframes(b'\x00\x00'*5512)
          PY

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import and parse
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --editor --path project --quit 2>&1 | tee import.log
          ! grep -E "ERROR:|SCRIPT ERROR|Parse Error|Cannot infer the type|leaked at exit|resources still in use" import.log

      - name: Smoke
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --verbose --path project res://tests/runtime/smoke_3d.tscn --quit-after 900 2>&1 | tee smoke.log
          grep -F "AMARBERRY_V3_SMOKE: PASS" smoke.log
          ! grep -E "ERROR:|SCRIPT ERROR|Parse Error|Cannot infer the type|leaked at exit|resources still in use" smoke.log

      - name: Extraction mission integration
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --verbose --path project res://tests/runtime/integration_3d.tscn --quit-after 1800 2>&1 | tee integration.log
          grep -F "AMARBERRY_V3_INTEGRATION: PASS" integration.log
          ! grep -E "ERROR:|SCRIPT ERROR|Parse Error|Cannot infer the type|leaked at exit|resources still in use" integration.log

      - name: Upload verified V3 project
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: amarberry-v3-godot-verified-project
          path: project
          if-no-files-found: error
